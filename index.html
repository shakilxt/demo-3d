<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Route Globe</title>
<style>
  :root {
    --bg: #f5f6f8;
    --grid: #dfe2e8;
    --dot: #b8bdc6;
    --marker: #e3342f;
    --arc: #f490a6;
    --runner: #ff1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --grid: #262a33;
      --dot: #4a505c;
      --marker: #ff4b45;
      --arc: #ff7f9b;
      --runner: #ff3b3b;
    }
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  #globe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="globe" aria-label="Rotating wireframe globe showing a travel route" role="img"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // Route: [lat, lon] pairs, travelled in order. Add, remove or reorder freely.
  // ---------------------------------------------------------------------------
  const ROUTE = [
    [23.8103, 90.4125],   // Dhaka
    [51.5074, -0.1278],   // London
    [40.7128, -74.0060],  // New York
  ];

  // Moving segment
  const SPEED = 0.32;          // legs per second
  const SEGMENT_LENGTH = 0.2;  // fraction of one leg
  const SEGMENT_POINTS = 46;   // minimum; densified on large screens so it stays solid
  const MAX_SEGMENT_POINTS = 400;
  const SEGMENT_SIZE = 3.4;    // px

  // Globe
  const SPIN_SPEED = 0.06;     // rad per second
  const TILT_X = 0.38;         // forward
  const TILT_Z = -0.12;        // sideways
  const GRID_STEP = 20;        // degrees
  const DOT_COUNT = 700;
  const DOT_SIZE = 1.6;        // px

  // Markers and arcs (globe radius = 1)
  const MARKER_SIZE = 0.028;   // world units (viewport height = 2 units)
  const MARKER_ALT = 1.012;
  const ARC_LIFT = 0.18;       // arc height per radian of distance
  const ARC_SAMPLES = 96;
  const BACK_OPACITY = 0.25;   // opacity of things on the far side

  const FOV = 16;

  // ---------------------------------------------------------------------------
  const D2R = Math.PI / 180;
  const canvas = document.getElementById('globe');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
  // Place the camera so the visible height at z = 0 is exactly 2 units.
  camera.position.set(0, 0, 1 / Math.tan((FOV / 2) * D2R));

  const tilt = new THREE.Group();
  tilt.rotation.set(TILT_X, 0, TILT_Z);
  scene.add(tilt);
  const spin = new THREE.Group();
  tilt.add(spin);

  function latLonToVec(lat, lon, r, out) {
    const phi = (90 - lat) * D2R;
    const theta = (lon + 180) * D2R;
    return (out || new THREE.Vector3()).set(
      -r * Math.sin(phi) * Math.cos(theta),
      r * Math.cos(phi),
      r * Math.sin(phi) * Math.sin(theta)
    );
  }

  // Fades geometry smoothly as it turns to the far side of the globe.
  const facingVertex = `
    uniform float uSize;
    varying float vFacing;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vec3 n = normalize(normalMatrix * position);
      vFacing = dot(n, normalize(-mv.xyz));
      gl_Position = projectionMatrix * mv;
      gl_PointSize = uSize;
    }`;
  const facingFragment = `
    uniform vec3 uColor;
    uniform float uOpacity;
    uniform float uBack;
    varying float vFacing;
    void main() {
      float a = mix(uBack, 1.0, smoothstep(-0.12, 0.2, vFacing));
      gl_FragColor = vec4(uColor, a * uOpacity);
    }`;
  function facingMaterial(opacity, back) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color() },
        uOpacity: { value: opacity },
        uBack: { value: back },
        uSize: { value: 1 },
      },
      vertexShader: facingVertex,
      fragmentShader: facingFragment,
      transparent: true,
      depthWrite: false,
    });
  }

  // --- Wireframe grid --------------------------------------------------------
  const gridMat = facingMaterial(1, 0.45);
  {
    const pos = [];
    const seg = 128;
    const a = new THREE.Vector3(), b = new THREE.Vector3();
    const push = (p, q) => pos.push(p.x, p.y, p.z, q.x, q.y, q.z);
    for (let lat = -90 + GRID_STEP; lat < 90; lat += GRID_STEP) {
      for (let i = 0; i < seg; i++) {
        latLonToVec(lat, -180 + (360 * i) / seg, 1, a);
        latLonToVec(lat, -180 + (360 * (i + 1)) / seg, 1, b);
        push(a, b);
      }
    }
    for (let lon = -180; lon < 180; lon += GRID_STEP) {
      for (let i = 0; i < seg; i++) {
        latLonToVec(-90 + (180 * i) / seg, lon, 1, a);
        latLonToVec(-90 + (180 * (i + 1)) / seg, lon, 1, b);
        push(a, b);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    const grid = new THREE.LineSegments(geo, gridMat);
    grid.renderOrder = 0;
    spin.add(grid);
  }

  // --- Scattered dots --------------------------------------------------------
  const dotMat = facingMaterial(0.9, 0.35);
  {
    const pos = new Float32Array(DOT_COUNT * 3);
    for (let i = 0; i < DOT_COUNT; i++) {
      const y = Math.random() * 2 - 1;
      const a = Math.random() * Math.PI * 2;
      const r = Math.sqrt(1 - y * y);
      pos[i * 3] = r * Math.cos(a);
      pos[i * 3 + 1] = y;
      pos[i * 3 + 2] = r * Math.sin(a);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    const dots = new THREE.Points(geo, dotMat);
    dots.renderOrder = 1;
    spin.add(dots);
  }

  // --- Arcs ------------------------------------------------------------------
  const stops = ROUTE.map(([lat, lon]) => latLonToVec(lat, lon, 1));
  const legs = [];
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    const omega = a.angleTo(b);
    legs.push({ a, b, omega, lift: ARC_LIFT * omega });
  }

  // Point on leg `i` at t in [0, 1]: great-circle slerp, lifted in a curve.
  function arcPoint(i, t, out) {
    const { a, b, omega, lift } = legs[i];
    if (omega < 1e-6) {
      out.copy(a);
    } else {
      const s = Math.sin(omega);
      const wa = Math.sin((1 - t) * omega) / s;
      const wb = Math.sin(t * omega) / s;
      out.set(a.x * wa + b.x * wb, a.y * wa + b.y * wb, a.z * wa + b.z * wb);
    }
    return out.multiplyScalar(MARKER_ALT + lift * Math.sin(Math.PI * t));
  }

  const arcMat = facingMaterial(0.55, 0.35);
  legs.forEach((_, i) => {
    const pts = [];
    for (let k = 0; k <= ARC_SAMPLES; k++) pts.push(arcPoint(i, k / ARC_SAMPLES, new THREE.Vector3()));
    const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), arcMat);
    line.renderOrder = 2;
    spin.add(line);
  });

  // --- Markers ---------------------------------------------------------------
  const markers = ROUTE.map(([lat, lon]) => {
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthWrite: false }));
    latLonToVec(lat, lon, MARKER_ALT, sprite.position);
    sprite.renderOrder = 3;
    spin.add(sprite);
    return sprite;
  });

  // --- Moving segment --------------------------------------------------------
  const runnerPos = new Float32Array(MAX_SEGMENT_POINTS * 3);
  const runnerGeo = new THREE.BufferGeometry();
  runnerGeo.setAttribute('position', new THREE.BufferAttribute(runnerPos, 3));
  const runnerMat = new THREE.PointsMaterial({
    size: SEGMENT_SIZE,
    sizeAttenuation: false,
    transparent: true,
    depthWrite: false,
  });
  const runner = new THREE.Points(runnerGeo, runnerMat);
  runner.frustumCulled = false;
  runner.renderOrder = 4;
  spin.add(runner);

  // --- Theme -----------------------------------------------------------------
  function applyTheme() {
    const cs = getComputedStyle(document.documentElement);
    const color = (name) => new THREE.Color(cs.getPropertyValue(name).trim());
    gridMat.uniforms.uColor.value.copy(color('--grid'));
    dotMat.uniforms.uColor.value.copy(color('--dot'));
    arcMat.uniforms.uColor.value.copy(color('--arc'));
    runnerMat.color.copy(color('--runner'));
    const marker = color('--marker');
    markers.forEach((m) => m.material.color.copy(marker));
  }

  // --- Layout ----------------------------------------------------------------
  function layout() {
    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    const pr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(pr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    dotMat.uniforms.uSize.value = DOT_SIZE * pr;

    // Visible area at the globe's centre plane is 2 units tall.
    const visH = 2;
    const visW = visH * camera.aspect;
    const r = Math.min(visW * 0.7, visH * 0.9);
    // Top of the globe sits near the upper part of the screen; the centre
    // stays low enough that the bottom edge always crops the sphere.
    const cy = Math.min(visH * 0.32 - r, -visH / 2 + r * 0.75);
    tilt.scale.setScalar(r);
    tilt.position.set(0, cy, 0);
    const ms = MARKER_SIZE / r;
    markers.forEach((m) => m.scale.set(ms, ms, 1));
  }

  // --- Per-frame updates -----------------------------------------------------
  const tmp = new THREE.Vector3();
  const nrm = new THREE.Vector3();
  const view = new THREE.Vector3();

  function smoothstep(e0, e1, x) {
    const t = Math.min(Math.max((x - e0) / (e1 - e0), 0), 1);
    return t * t * (3 - 2 * t);
  }
  // Opacity for a point given in world space, based on which side it faces.
  function facingOpacity(world) {
    nrm.subVectors(world, tilt.position).normalize();
    view.subVectors(camera.position, world).normalize();
    return BACK_OPACITY + (1 - BACK_OPACITY) * smoothstep(-0.12, 0.2, nrm.dot(view));
  }

  let progress = 0; // position of the segment head, in legs
  const travel = legs.length + SEGMENT_LENGTH;

  // Point along the whole route, where s runs from 0 to legs.length.
  function routePoint(s, out) {
    const leg = Math.min(Math.floor(s), legs.length - 1);
    return arcPoint(leg, s - leg, out);
  }

  // Enough points that neighbours overlap (half a point apart) on screen.
  const prevNdc = new THREE.Vector3();
  function segmentPointCount() {
    const halfW = renderer.domElement.clientWidth / 2;
    const halfH = renderer.domElement.clientHeight / 2;
    let px = 0;
    for (let k = 0; k <= 8; k++) {
      const s = Math.min(Math.max(progress - (SEGMENT_LENGTH * k) / 8, 0), legs.length);
      routePoint(s, tmp).applyMatrix4(spin.matrixWorld).project(camera);
      if (k) px += Math.hypot((tmp.x - prevNdc.x) * halfW, (tmp.y - prevNdc.y) * halfH);
      prevNdc.copy(tmp);
    }
    const needed = Math.ceil(px / (SEGMENT_SIZE * 0.5)) + 1;
    return Math.min(Math.max(SEGMENT_POINTS, needed), MAX_SEGMENT_POINTS);
  }

  function updateRunner() {
    let n = 0;
    let headSet = false;
    const count = legs.length ? segmentPointCount() : 0;
    for (let i = 0; i < count; i++) {
      const s = progress - (SEGMENT_LENGTH * i) / (count - 1);
      if (s < 0 || s > legs.length) continue;
      routePoint(s, tmp);
      runnerPos[n * 3] = tmp.x;
      runnerPos[n * 3 + 1] = tmp.y;
      runnerPos[n * 3 + 2] = tmp.z;
      if (!headSet) {
        runnerMat.opacity = facingOpacity(tmp.applyMatrix4(spin.matrixWorld));
        headSet = true;
      }
      n++;
    }
    runnerGeo.setDrawRange(0, n);
    runnerGeo.attributes.position.needsUpdate = true;
  }

  function updateMarkers() {
    markers.forEach((m) => {
      m.getWorldPosition(tmp);
      m.material.opacity = facingOpacity(tmp);
    });
  }

  function render() {
    scene.updateMatrixWorld();
    updateRunner();
    updateMarkers();
    renderer.render(scene, camera);
  }

  // --- Motion ----------------------------------------------------------------
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const darkScheme = window.matchMedia('(prefers-color-scheme: dark)');

  // Face the middle of the route towards the viewer on load.
  if (stops.length) {
    const mid = stops.reduce((acc, v) => acc.add(v), new THREE.Vector3());
    if (mid.x || mid.z) spin.rotation.y = -Math.atan2(mid.x, mid.z);
  }
  // With reduced motion, show a still segment partway along the first leg.
  if (reducedMotion.matches) progress = 0.5 + SEGMENT_LENGTH / 2;

  let rafId = 0;
  let last = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    spin.rotation.y += SPIN_SPEED * dt;
    progress += SPEED * dt;
    if (progress > travel) progress -= travel;
    render();
    rafId = reducedMotion.matches ? 0 : requestAnimationFrame(frame);
  }
  function start() {
    if (rafId || reducedMotion.matches) return;
    last = performance.now();
    rafId = requestAnimationFrame(frame);
  }
  function stop() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    render();
  }

  function onChange(mq, fn) {
    if (mq.addEventListener) mq.addEventListener('change', fn);
    else mq.addListener(fn);
  }
  onChange(reducedMotion, () => (reducedMotion.matches ? stop() : start()));
  onChange(darkScheme, () => {
    applyTheme();
    render();
  });
  window.addEventListener('resize', () => {
    layout();
    render();
  });

  applyTheme();
  layout();
  render();
  start();
})();
</script>
</body>
</html>
