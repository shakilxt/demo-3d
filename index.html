<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Route Globe</title>
<style>
  :root {
    --bg: #f5f6f8;
    --globe-line: #5b7fd1;
    --globe-node: #3e66c6;
    --globe-orbit: #6f8cc9;
    --globe-fill: #dbe4f6;
    --globe-glow: #c3d3f2;
    --marker: #e3342f;
    --arc: #f490a6;
    --runner: #ff1a1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --globe-line: #6f9cf0;
      --globe-node: #a9c6ff;
      --globe-orbit: #eef3ff;
      --globe-fill: #173064;
      --globe-glow: #2a57b0;
      --marker: #ff4b45;
      --arc: #ff7f9b;
      --runner: #ff3b3b;
    }
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  #globe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<canvas id="globe" aria-label="Rotating network globe showing a travel route" role="img"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  // ---------------------------------------------------------------------------
  // Route: [lat, lon] pairs, travelled in order. Add, remove or reorder freely.
  // ---------------------------------------------------------------------------
  const ROUTE = [
    [23.8103, 90.4125],   // Dhaka
    [51.5074, -0.1278],   // London
    [40.7128, -74.0060],  // New York
  ];

  // Moving segment
  const SPEED = 0.32;          // legs per second
  const SEGMENT_LENGTH = 0.2;  // fraction of one leg
  const SEGMENT_POINTS = 46;   // minimum; densified on large screens so it stays solid
  const MAX_SEGMENT_POINTS = 400;
  const SEGMENT_SIZE = 3.4;    // px

  // Globe
  const SPIN_SPEED = 0.06;     // rad per second
  const TILT_X = 0.38;         // forward
  const TILT_Z = -0.12;        // sideways
  const LAND_LATTICE = 14000;  // lattice size for land nodes (~2300 kept)
  const OCEAN_LATTICE = 700;   // lattice size for ocean nodes (~270 kept)
  const LAND_DUST = 1800;      // unlinked specks inside the continents
  const NEIGHBOURS = 4;        // links per node
  const MAX_EDGE = 0.42;       // longest link (chord, globe radius = 1)
  const STAR_CHANCE = 0.018;   // share of land nodes drawn as twinkling highlights
  const DOT_COUNT = 700;       // faint dust over the surface
  const DOT_SIZE = 1.6;        // px
  const ORBIT_COUNT = 26;      // dots floating around the globe
  const ORBIT_SPEED = 0.02;    // rad per second

  // Markers and arcs (globe radius = 1)
  const MARKER_SIZE = 0.028;   // world units (viewport height = 2 units)
  const MARKER_ALT = 1.012;
  const ARC_LIFT = 0.18;       // arc height per radian of distance
  const ARC_SAMPLES = 96;
  const BACK_OPACITY = 0.25;   // opacity of things on the far side

  const FOV = 16;

  // ---------------------------------------------------------------------------
  const D2R = Math.PI / 180;
  const canvas = document.getElementById('globe');
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(FOV, 1, 0.1, 100);
  // Place the camera so the visible height at z = 0 is exactly 2 units.
  camera.position.set(0, 0, 1 / Math.tan((FOV / 2) * D2R));

  const tilt = new THREE.Group();
  tilt.rotation.set(TILT_X, 0, TILT_Z);
  scene.add(tilt);
  const spin = new THREE.Group();
  tilt.add(spin);

  function latLonToVec(lat, lon, r, out) {
    const phi = (90 - lat) * D2R;
    const theta = (lon + 180) * D2R;
    return (out || new THREE.Vector3()).set(
      -r * Math.sin(phi) * Math.cos(theta),
      r * Math.cos(phi),
      r * Math.sin(phi) * Math.sin(theta)
    );
  }

  // --- Land mask -------------------------------------------------------------
  // 240 x 120 bitmap (1.5 degree cells, row 0 at the north pole, column 0 at
  // lon -180), rasterised from Natural Earth 1:50m land. 1 bit per cell.
  const LAND_W = 240;
  const LAND_H = 120;
  const LAND_MASK = 'AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADofwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPj/n////2MAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAP/++f///x8AACABgGkAAOABAAAAAAAAAAAAAAAAWPw//v///wMAAD8AAAAAAAA4AAAAAAAAAAAAAAAHAMAB/P///w8AAAwAAAAAAAgwAAAAAAAAAAAAAAC8cxgDAP7//wcAAAAAAIAHAMD/DwD0AAAAAAAAAOACAAAAAPz//wcAAAAAAGAAAPz/AQAAAAAAAAAAAOA/Y7UDAPD/vwEAAAAAABjAwP//9z9AAAAAA4AAAED8A2P/AeD/fwMAAAAAABDg9v///z//HwCAAPj/A0/8X4PkB9j//wAAAPA/AADj/v///////wc9A/7///8Hwp6hB8D/DwAAAPj/Y+z//f//////////N/D///////+Bf+D/AQAAAP6/x/+//v//////////GP7//////7/wJ+AfAH4AAD5++P//////////////AOD//////8sCH8AfAAwAwL////////////////9/APz//////wNxDIAPAAAI8M////////////////8fAPjf/////wHwAwAOAAAA+M///////////////+ADAPAB+P///wHwMwAAAAAA+A////////////9/YhgAAIAC4P///wPgfwAAAAAQABf///////////8fAB4AACAAAP///x/ofwAAAAAwYMb///////////8PAB8AAAQAgP7////5/wEAAABMwOD///////////8DAA8AAAAAAPz////5/wcAAADs8P////////////8/AAcAAAAAAPj////7/wMAAADi+f////////////+/AAEAAAAAAPj/////jwAAAAAw/v////////////+/gAAAAAAAAOD/////Gw4AAACA//////////////8fAAAAAAAAAOD/////HxAAAACA//////////////8fAAAAAAAAAOD/////PwAAAACA//9P/vj///////8PAAAAAAAAAOD/////EwAAAACA//wHfPz////////HAAAAAAAAAOD/////AQAAAAD8g/EH8Pj////////gAAAAAAAAAOD///9/AAAAAAD8Aebn+fH//////z8AAAAAAAAAAOD///9/AAAAAAD8AGD+//H//////xpgAAAAAAAAAMD///8/AAAAAAD8AMT8//H/////fzggAAAAAAAAAID///8fAAAAAAAQdADs//v//////zE4AAAAAAAAAID///8fAAAAAACwfwBD/////////zA/AAAAAAAAAAD+//8HAAAAAAD4fwAA/////////0AHAAAAAAAAAAD8//8DAAAAAAD8/2OA/////////4EAAAAAAAAAAADo//8DAAAAAAD+/+///////////wEAAAAAAAAAAAD4/xkCAAAAAAD+//////z//////wEAAAAAAAAAAADYfwACAAAAAID///8///n//////wAAAAAAAAAAAACgfwAGAAAAAMD///9//8H//////wAAAAAAAAAAAAAgfwAAAAAAAMD///9//jPg////fwAAAAAAAAAAAAAAfgAAAAAAAOD//////H/A////PwEAAAAAAAAAAAAAfAAIAAAAAOD//////f/A/+//BwAAAAAAAAAAAAAAfDBwAAAAAOD/////+X8A/sN/AAAAAAAAAAAAAAAA+DgAAwAAAOD/////+T8A/oA/AwAAAAAAAAAAAAAA4B8AAAAAAOD/////8x8AfoB/AAMAAAAAAAAAAAAAgPwAAAAAAOD/////8wcAPgD+AAEAAAAAAAAAAAAAAPgBAAAAAOD/////7wEAHAD+AQEAAAAAAAAAAAAAAMAAAAAAAOD/////PwAAHAD8AQAAAAAAAAAAAAAAAICAAgAAAOD/////HwMAGADgAQ4AAAAAAAAAAAAAAADBfgAAAID//////wMAOABAAAAAAAAAAAAAAAAAAADy/wAAAID//////wEAKAAEAAwAAAAAAAAAAAAAAADw/wEAAAD//////wEAYAAIAAgAAAAAAAAAAAAAAADw/x8AAAB88P///wAAAIAZ4AAAAAAAAAAAAAAAAADg/z8AAAAAwP///wAAAAAbMAAAAAAAAAAAAAAAAADw/z8AAAAAgP//PwAAAAAWfCAAAAAAAAAAAAAAAAD4/z8AAAAAwP//HwAAAAAMficAAAAAAAAAAAAAAAD8//8BAAAAwP//DwAAAAAYPiAFAAAAAAAAAAAAAAD8//8DAAAAwP//BwAAAAA8vgEZAAAAAAAAAAAAAAD8//8/AAAAgP//BwAAAABwMBL+AAAAAAAAAAAAAAD8////AAAAAP//BwAAAABgAADwAQAAAAAAAAAAAAD4////AQAAAP//AwAAAADAAADiAwAAAAAAAAAAAAD4////AQAAAP7/AwAAAAAAHATwBgAAAAAAAAAAAADw////AAAAAP7/AwAAAAAAAAQADAAAAAAAAAAAAADw//9/AAAAAP7/BwAAAAAAAIAAAAAAAAAAAAAAAADg//9/AAAAAP7/BwAAAAAAAICHAAAAAAAAAAAAAADg//8/AAAAAP//BwEAAAAAANDHAAAAAAAAAAAAAADA//8/AAAAAP//hwMAAAAAAPjHAQAAAAAAAAAAAAAA//8/AAAAAP//4QEAAAAAAP7fAQAAAAAAAAAAAAAA/v8/AAAAAP//4AEAAAAAAP7/AwAAAAAAAAAAAAAA/v8fAAAAAP5/wEAAAAAAgP//BwAAAAAAAAAAAAAA/v8fAAAAAP7/4AAAAAAA4P//D0AAAAAAAAAAAAAA/v8DAAAAAPz/4AAAAAAA8P//HwAAAAAAAAAAAAAA/v8AAAAAAPx/YAAAAAAA8P//PwAAAAAAAAAAAAAA/v8AAAAAAPw/AAAAAAAA+P//PwAAAAAAAAAAAAAA/v8AAAAAAPw/AAAAAAAA8P//PwAAAAAAAAAAAAAA/38AAAAAAPgfAAAAAAAA4P//PwAAAAAAAAAAAAAA/z8AAAAAAPAPAAAAAAAA4P//PwAAAAAAAAAAAAAA/x8AAAAAAPAHAAAAAAAA4B/+PwAAAAAAAAAAAAAA/w8AAAAAAPABAAAAAAAA4AP0HwAAAAAAAAAAAAAA/wMAAAAAAAAAAAAAAAAAAADwDwAIAAAAAAAAAACA/wMAAAAAAAAAAAAAAAAAAADgDwAQAAAAAAAAAACA/wEAAAAAAAAAAAAAAAAAAADAAgBwAAAAAAAAAACAfwAAAAAAAAAAAAAAAAAAAAAAAAAwAAAAAAAAAACAHwAAAAAAAAAAAAAAAAAAAAAABwAQAAAAAAAAAACAPwAAAAAAAAAAAAAAAAAAAAAABgAMAAAAAAAAAACADwAAAAAAAAAAAAAAAAAAAAAAAAADAAAAAAAAAACABwAAAAAAAAAAAAAAAAAAAAAAAIADAAAAAAAAAADADwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADABwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAADAAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAwEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAHAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAYAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAD0AAPD/Htw/AAAAAAAAAAAAAAAAGAAAAAAAAAAA8P9/4P//////AwAAAAAAAAAAAAAAPwAAAAAAAADA/f8/+P///////wcAAAAAAAAAAAAAewAAAAAK//////8///////////8AAAAAAAAACAAA+AAAAMD///////////////////8BAAAAAEAo8P//fwAAAMD//////////////////z8AAAAA////////HwAAAP///////////////////w8AAICB//////8fAAAA/P///////////////////x8AAAj///////8MBMAD/////////////////////x8AAADw//////8fgPAD8P///////////////////wMAAAD+////////DwDw/////////////////////w8AwIP/////////f/7///////////////////////8A/8D/////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////////';
  const landBits = Uint8Array.from(atob(LAND_MASK), (c) => c.charCodeAt(0));
  function isLand(lat, lon) {
    const x = ((Math.floor(((lon + 180) / 360) * LAND_W) % LAND_W) + LAND_W) % LAND_W;
    const y = Math.min(LAND_H - 1, Math.max(0, Math.floor(((90 - lat) / 180) * LAND_H)));
    const i = y * LAND_W + x;
    return (landBits[i >> 3] >> (i & 7)) & 1;
  }
  function isCoast(lat, lon) {
    const d = 180 / LAND_H;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (!isLand(lat + dy * d, lon + dx * d)) return true;
      }
    }
    return false;
  }

  // Seeded random, so the network looks the same on every load.
  let seed = 20240917;
  function rand() {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  // --- Shaders ---------------------------------------------------------------
  // Everything on the globe fades smoothly as it turns to the far side.
  const FACING = `
    varying float vFacing;
    float facing(vec4 mv) {
      return dot(normalize(normalMatrix * position), normalize(-mv.xyz));
    }`;
  const FADE = `
    uniform float uBack;
    varying float vFacing;
    float fade() { return mix(uBack, 1.0, smoothstep(-0.12, 0.2, vFacing)); }`;

  function lineMaterial(back) {
    return new THREE.ShaderMaterial({
      uniforms: { uColor: { value: new THREE.Color() }, uBack: { value: back } },
      vertexShader: `
        attribute float aAlpha;
        varying float vAlpha;
        ${FACING}
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vFacing = facing(mv);
          vAlpha = aAlpha;
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        uniform vec3 uColor;
        varying float vAlpha;
        ${FADE}
        void main() { gl_FragColor = vec4(uColor, vAlpha * fade()); }`,
      transparent: true,
      depthWrite: false,
    });
  }

  // Round points. aGlow > 0 adds a soft halo and a gentle twinkle.
  function pointMaterial(back) {
    return new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color() },
        uBack: { value: back },
        uPixelRatio: { value: 1 },
        uTime: { value: 0 },
      },
      vertexShader: `
        attribute float aSize;
        attribute float aAlpha;
        attribute float aGlow;
        attribute float aPhase;
        uniform float uPixelRatio;
        uniform float uTime;
        varying float vAlpha;
        varying float vGlow;
        ${FACING}
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          vFacing = facing(mv);
          float tw = 0.75 + 0.25 * sin(uTime * 1.6 + aPhase);
          vAlpha = aAlpha * mix(1.0, tw, aGlow);
          vGlow = aGlow;
          gl_Position = projectionMatrix * mv;
          gl_PointSize = aSize * uPixelRatio * mix(1.0, tw, aGlow);
        }`,
      fragmentShader: `
        uniform vec3 uColor;
        varying float vAlpha;
        varying float vGlow;
        ${FADE}
        void main() {
          float r = length(gl_PointCoord - 0.5) * 2.0;
          float core = 1.0 - smoothstep(mix(0.6, 0.18, vGlow), mix(1.0, 0.3, vGlow), r);
          float halo = pow(1.0 - clamp(r, 0.0, 1.0), 2.0) * 0.55 * vGlow;
          float a = max(core, halo) * vAlpha * fade();
          if (a < 0.003) discard;
          gl_FragColor = vec4(uColor, a);
        }`,
      transparent: true,
      depthWrite: false,
    });
  }

  function pointsObject(list, material) {
    const n = list.length;
    const pos = new Float32Array(n * 3);
    const size = new Float32Array(n), alpha = new Float32Array(n);
    const glow = new Float32Array(n), phase = new Float32Array(n);
    list.forEach((p, i) => {
      pos.set([p.v.x, p.v.y, p.v.z], i * 3);
      size[i] = p.size;
      alpha[i] = p.alpha;
      glow[i] = p.glow || 0;
      phase[i] = rand() * Math.PI * 2;
    });
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
    geo.setAttribute('aAlpha', new THREE.BufferAttribute(alpha, 1));
    geo.setAttribute('aGlow', new THREE.BufferAttribute(glow, 1));
    geo.setAttribute('aPhase', new THREE.BufferAttribute(phase, 1));
    return new THREE.Points(geo, material);
  }

  // --- Atmosphere: soft fill, brighter rim and an outer halo -----------------
  const fillMat = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color() }, uFill: { value: 0.35 }, uRim: { value: 0.6 } },
    vertexShader: `
      varying float vRim;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        vRim = 1.0 - max(dot(normalize(normalMatrix * normal), normalize(-mv.xyz)), 0.0);
        gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uFill;
      uniform float uRim;
      varying float vRim;
      void main() { gl_FragColor = vec4(uColor, uFill + pow(vRim, 3.0) * uRim); }`,
    transparent: true,
    depthWrite: false,
  });
  const fill = new THREE.Mesh(new THREE.SphereGeometry(0.995, 96, 64), fillMat);
  fill.renderOrder = -1;
  tilt.add(fill);

  const haloMat = new THREE.SpriteMaterial({ transparent: true, depthWrite: false, depthTest: false });
  {
    const c = document.createElement('canvas');
    c.width = c.height = 256;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(0.7, 'rgba(255,255,255,0)');
    grad.addColorStop(0.76, 'rgba(255,255,255,0.55)');
    grad.addColorStop(0.84, 'rgba(255,255,255,0.18)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 256, 256);
    haloMat.map = new THREE.CanvasTexture(c);
  }
  const halo = new THREE.Sprite(haloMat);
  halo.scale.set(2.64, 2.64, 1);
  halo.renderOrder = -2;
  tilt.add(halo);

  // --- Network nodes ---------------------------------------------------------
  // Dense on land, sparse over the oceans, spaced on a jittered Fibonacci
  // lattice so continents read clearly without looking gridded.
  const nodes = [];
  function fibonacci(count, keep) {
    const golden = Math.PI * (3 - Math.sqrt(5));
    const jitter = 1.1 * Math.sqrt(4 / count);
    for (let i = 0; i < count; i++) {
      const y = 1 - ((i + 0.5) / count) * 2;
      const r = Math.sqrt(1 - y * y);
      const v = new THREE.Vector3(Math.cos(golden * i) * r, y, Math.sin(golden * i) * r);
      v.x += (rand() - 0.5) * jitter;
      v.y += (rand() - 0.5) * jitter;
      v.z += (rand() - 0.5) * jitter;
      v.normalize();
      const lat = 90 - Math.acos(v.y) / D2R;
      const lon = Math.atan2(v.z, -v.x) / D2R - 180;
      const land = isLand(lat, lon);
      if (keep(land)) nodes.push({ v, land, coast: land && isCoast(lat, lon) });
    }
  }
  fibonacci(LAND_LATTICE, (land) => land && rand() < 0.62);
  fibonacci(OCEAN_LATTICE, (land) => !land && rand() < 0.55);

  // Connect every node to its nearest neighbours. Dense land gives small
  // triangles, sparse ocean gives the large low-poly facets.
  const edgePos = [];
  const edgeAlpha = [];
  {
    const seen = new Set();
    const n = nodes.length;
    const best = [];
    for (let i = 0; i < n; i++) {
      const a = nodes[i];
      best.length = 0;
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const d = a.v.distanceToSquared(nodes[j].v);
        if (d > MAX_EDGE * MAX_EDGE) continue;
        if (best.length < NEIGHBOURS) best.push([d, j]);
        else if (d < best[NEIGHBOURS - 1][0]) best[NEIGHBOURS - 1] = [d, j];
        else continue;
        best.sort((p, q) => p[0] - q[0]);
      }
      for (const [, j] of best) {
        const key = i < j ? i * n + j : j * n + i;
        if (seen.has(key)) continue;
        seen.add(key);
        const b = nodes[j];
        const alpha = a.coast && b.coast ? 0.6 : a.land && b.land ? 0.24 : 0.14;
        edgePos.push(a.v.x, a.v.y, a.v.z, b.v.x, b.v.y, b.v.z);
        edgeAlpha.push(alpha, alpha);
      }
    }
  }
  const edgeMat = lineMaterial(0.2);
  {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(edgePos, 3));
    geo.setAttribute('aAlpha', new THREE.Float32BufferAttribute(edgeAlpha, 1));
    const edges = new THREE.LineSegments(geo, edgeMat);
    edges.renderOrder = 0;
    spin.add(edges);
  }

  // Node sizes: coast brighter, a few twinkling highlights, ocean faint.
  const nodeMat = pointMaterial(0.22);
  {
    const list = nodes.map((p) => {
      if (p.land && rand() < STAR_CHANCE) return { v: p.v, size: 16 + rand() * 10, alpha: 1, glow: 1 };
      if (p.coast) return { v: p.v, size: 2.8 + rand() * 1.4, alpha: 1 };
      if (p.land) return { v: p.v, size: 2 + rand() * 1.8, alpha: 0.85 };
      return { v: p.v, size: 2 + rand() * 1.4, alpha: 0.6 };
    });
    // Unlinked specks that thicken the continents.
    for (let placed = 0, tries = 0; placed < LAND_DUST && tries < LAND_DUST * 20; tries++) {
      const lat = Math.asin(rand() * 2 - 1) / D2R;
      const lon = rand() * 360 - 180;
      if (!isLand(lat, lon)) continue;
      list.push({ v: latLonToVec(lat, lon, 1), size: 1.2 + rand() * 1.2, alpha: 0.35 + rand() * 0.35 });
      placed++;
    }
    // Fine dust scattered over the whole surface.
    for (let i = 0; i < DOT_COUNT; i++) {
      const y = rand() * 2 - 1;
      const a = rand() * Math.PI * 2;
      const r = Math.sqrt(1 - y * y);
      list.push({ v: new THREE.Vector3(r * Math.cos(a), y, r * Math.sin(a)), size: DOT_SIZE, alpha: 0.4 });
    }
    const pts = pointsObject(list, nodeMat);
    pts.renderOrder = 1;
    spin.add(pts);
  }

  // --- Orbiting dots ---------------------------------------------------------
  // A loose ring of dots floating just outside the silhouette.
  const orbit = new THREE.Group();
  scene.add(orbit);
  const orbitMat = pointMaterial(1);
  {
    const list = [];
    for (let i = 0; i < ORBIT_COUNT; i++) {
      const a = (i / ORBIT_COUNT) * Math.PI * 2 + (rand() - 0.5) * 0.35;
      const r = 1.08 + rand() * 0.2;
      const v = new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, (rand() - 0.5) * 0.3);
      list.push({ v, size: 3 + rand() * 1.8, alpha: 0.9 });
    }
    const pts = pointsObject(list, orbitMat);
    pts.renderOrder = 5;
    orbit.add(pts);
  }

  // --- Arcs ------------------------------------------------------------------
  const stops = ROUTE.map(([lat, lon]) => latLonToVec(lat, lon, 1));
  const legs = [];
  for (let i = 0; i < stops.length - 1; i++) {
    const a = stops[i], b = stops[i + 1];
    const omega = a.angleTo(b);
    legs.push({ a, b, omega, lift: ARC_LIFT * omega });
  }

  // Point on leg `i` at t in [0, 1]: great-circle slerp, lifted in a curve.
  function arcPoint(i, t, out) {
    const { a, b, omega, lift } = legs[i];
    if (omega < 1e-6) {
      out.copy(a);
    } else {
      const s = Math.sin(omega);
      const wa = Math.sin((1 - t) * omega) / s;
      const wb = Math.sin(t * omega) / s;
      out.set(a.x * wa + b.x * wb, a.y * wa + b.y * wb, a.z * wa + b.z * wb);
    }
    return out.multiplyScalar(MARKER_ALT + lift * Math.sin(Math.PI * t));
  }

  const arcMat = lineMaterial(0.35);
  legs.forEach((_, i) => {
    const pts = [];
    for (let k = 0; k <= ARC_SAMPLES; k++) pts.push(arcPoint(i, k / ARC_SAMPLES, new THREE.Vector3()));
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    geo.setAttribute('aAlpha', new THREE.Float32BufferAttribute(new Array(pts.length).fill(0.6), 1));
    const line = new THREE.Line(geo, arcMat);
    line.renderOrder = 2;
    spin.add(line);
  });

  // --- Markers ---------------------------------------------------------------
  const markers = ROUTE.map(([lat, lon]) => {
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true, depthWrite: false }));
    latLonToVec(lat, lon, MARKER_ALT, sprite.position);
    sprite.renderOrder = 3;
    spin.add(sprite);
    return sprite;
  });

  // --- Moving segment --------------------------------------------------------
  const runnerPos = new Float32Array(MAX_SEGMENT_POINTS * 3);
  const runnerGeo = new THREE.BufferGeometry();
  runnerGeo.setAttribute('position', new THREE.BufferAttribute(runnerPos, 3));
  const runnerMat = new THREE.PointsMaterial({
    size: SEGMENT_SIZE,
    sizeAttenuation: false,
    transparent: true,
    depthWrite: false,
  });
  const runner = new THREE.Points(runnerGeo, runnerMat);
  runner.frustumCulled = false;
  runner.renderOrder = 4;
  spin.add(runner);

  // --- Theme -----------------------------------------------------------------
  function applyTheme() {
    const cs = getComputedStyle(document.documentElement);
    const color = (name) => new THREE.Color(cs.getPropertyValue(name).trim());
    edgeMat.uniforms.uColor.value.copy(color('--globe-line'));
    nodeMat.uniforms.uColor.value.copy(color('--globe-node'));
    orbitMat.uniforms.uColor.value.copy(color('--globe-orbit'));
    fillMat.uniforms.uColor.value.copy(color('--globe-fill'));
    haloMat.color.copy(color('--globe-glow'));
    arcMat.uniforms.uColor.value.copy(color('--arc'));
    runnerMat.color.copy(color('--runner'));
    const marker = color('--marker');
    markers.forEach((m) => m.material.color.copy(marker));
  }

  // --- Layout ----------------------------------------------------------------
  function layout() {
    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    const pr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(pr);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    nodeMat.uniforms.uPixelRatio.value = pr;
    orbitMat.uniforms.uPixelRatio.value = pr;

    // Visible area at the globe's centre plane is 2 units tall.
    const visH = 2;
    const visW = visH * camera.aspect;
    const r = Math.min(visW * 0.7, visH * 0.9);
    // Top of the globe sits near the upper part of the screen; the centre
    // stays low enough that the bottom edge always crops the sphere.
    const cy = Math.min(visH * 0.32 - r, -visH / 2 + r * 0.75);
    tilt.scale.setScalar(r);
    tilt.position.set(0, cy, 0);
    orbit.scale.setScalar(r);
    orbit.position.copy(tilt.position);
    const ms = MARKER_SIZE / r;
    markers.forEach((m) => m.scale.set(ms, ms, 1));
  }

  // --- Per-frame updates -----------------------------------------------------
  const tmp = new THREE.Vector3();
  const nrm = new THREE.Vector3();
  const view = new THREE.Vector3();

  function smoothstep(e0, e1, x) {
    const t = Math.min(Math.max((x - e0) / (e1 - e0), 0), 1);
    return t * t * (3 - 2 * t);
  }
  // Opacity for a point given in world space, based on which side it faces.
  function facingOpacity(world) {
    nrm.subVectors(world, tilt.position).normalize();
    view.subVectors(camera.position, world).normalize();
    return BACK_OPACITY + (1 - BACK_OPACITY) * smoothstep(-0.12, 0.2, nrm.dot(view));
  }

  let progress = 0; // position of the segment head, in legs
  const travel = legs.length + SEGMENT_LENGTH;

  // Point along the whole route, where s runs from 0 to legs.length.
  function routePoint(s, out) {
    const leg = Math.min(Math.floor(s), legs.length - 1);
    return arcPoint(leg, s - leg, out);
  }

  // Enough points that neighbours overlap (half a point apart) on screen.
  const prevNdc = new THREE.Vector3();
  function segmentPointCount() {
    const halfW = renderer.domElement.clientWidth / 2;
    const halfH = renderer.domElement.clientHeight / 2;
    let px = 0;
    for (let k = 0; k <= 8; k++) {
      const s = Math.min(Math.max(progress - (SEGMENT_LENGTH * k) / 8, 0), legs.length);
      routePoint(s, tmp).applyMatrix4(spin.matrixWorld).project(camera);
      if (k) px += Math.hypot((tmp.x - prevNdc.x) * halfW, (tmp.y - prevNdc.y) * halfH);
      prevNdc.copy(tmp);
    }
    const needed = Math.ceil(px / (SEGMENT_SIZE * 0.5)) + 1;
    return Math.min(Math.max(SEGMENT_POINTS, needed), MAX_SEGMENT_POINTS);
  }

  function updateRunner() {
    let n = 0;
    let headSet = false;
    const count = legs.length ? segmentPointCount() : 0;
    for (let i = 0; i < count; i++) {
      const s = progress - (SEGMENT_LENGTH * i) / (count - 1);
      if (s < 0 || s > legs.length) continue;
      routePoint(s, tmp);
      runnerPos[n * 3] = tmp.x;
      runnerPos[n * 3 + 1] = tmp.y;
      runnerPos[n * 3 + 2] = tmp.z;
      if (!headSet) {
        runnerMat.opacity = facingOpacity(tmp.applyMatrix4(spin.matrixWorld));
        headSet = true;
      }
      n++;
    }
    runnerGeo.setDrawRange(0, n);
    runnerGeo.attributes.position.needsUpdate = true;
  }

  function updateMarkers() {
    markers.forEach((m) => {
      m.getWorldPosition(tmp);
      m.material.opacity = facingOpacity(tmp);
    });
  }

  function render() {
    scene.updateMatrixWorld();
    updateRunner();
    updateMarkers();
    renderer.render(scene, camera);
  }

  // --- Motion ----------------------------------------------------------------
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const darkScheme = window.matchMedia('(prefers-color-scheme: dark)');

  // Face the middle of the route towards the viewer on load.
  if (stops.length) {
    const mid = stops.reduce((acc, v) => acc.add(v), new THREE.Vector3());
    if (mid.x || mid.z) spin.rotation.y = -Math.atan2(mid.x, mid.z);
  }
  // With reduced motion, show a still segment partway along the first leg.
  if (reducedMotion.matches) progress = 0.5 + SEGMENT_LENGTH / 2;

  let rafId = 0;
  let last = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    spin.rotation.y += SPIN_SPEED * dt;
    orbit.rotation.z += ORBIT_SPEED * dt;
    nodeMat.uniforms.uTime.value = now / 1000;
    progress += SPEED * dt;
    if (progress > travel) progress -= travel;
    render();
    rafId = reducedMotion.matches ? 0 : requestAnimationFrame(frame);
  }
  function start() {
    if (rafId || reducedMotion.matches) return;
    last = performance.now();
    rafId = requestAnimationFrame(frame);
  }
  function stop() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    render();
  }

  function onChange(mq, fn) {
    if (mq.addEventListener) mq.addEventListener('change', fn);
    else mq.addListener(fn);
  }
  onChange(reducedMotion, () => (reducedMotion.matches ? stop() : start()));
  onChange(darkScheme, () => {
    applyTheme();
    render();
  });
  window.addEventListener('resize', () => {
    layout();
    render();
  });

  applyTheme();
  layout();
  render();
  start();
})();
</script>
</body>
</html>
